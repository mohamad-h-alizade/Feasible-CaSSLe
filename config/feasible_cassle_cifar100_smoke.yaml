experiment:
  name: feasible_cassle_cifar100_smoke
  output_dir: ${FEASIBLE_CASSLE_OUT:-outputs/feasible_cassle}
  seed: 5
  device: auto
  methods:
    - offline_ssl
    - finetune
    - standard_cassle
    - crossfit_cassle
    - feasible_cassle
    - compute_matched_finetune

data:
  dataset: cifar100
  download: true
  cifar_root: cifar100
  data_dir: ${DATA_DIR:-./data}
  train_dir:
  val_dir:
  num_workers: 0
  support_batch_size: 32
  query_batch_size: 32
  drop_last: true
  limit_examples_per_task: 640
  offline_limit_examples: 640

augmentations:
  brightness: 0.8
  contrast: 0.8
  saturation: 0.8
  hue: 0.2
  gaussian_prob: 0.0
  solarization_prob: 0.0
  min_scale: 0.08

model:
  method: simclr
  encoder: resnet18
  zero_init_residual: false
  simclr:
    output_dim: 256
    proj_hidden_dim: 2048
    temperature: 0.2
    supervised: false
  byol:
    output_dim: 256
    proj_hidden_dim: 2048
    pred_hidden_dim: 512
  barlow_twins:
    output_dim: 2048
    proj_hidden_dim: 2048
    lamb: 0.005
    scale_loss: 0.025

training:
  num_tasks: 5
  task1_checkpoint:
  task1_epochs: 1
  epochs_per_task: 1
  max_query_updates_per_task: 4
  offline_epochs: 1
  offline_max_query_updates: 4

optimization:
  lr: 0.03
  weight_decay: 0.00001

temporal:
  predictor_hidden_dim: 2048
  predictor_norm: batchnorm
  predictor_lr: 0.001
  predictor_updates_per_step: 1
  predictor_updates_early: 3
  predictor_early_fraction: 0.10
  calibration_batches: 2
  good_quantile: 0.95
  rho: 0.05
  rho_grid: [0.025, 0.05, 0.10]
  distill_gamma: 1.0
  distill_gamma_grid: [0.1, 0.5, 1.0]
  distill_temperature: 0.2
  barrier_kappa: 0.1
  qp_delta: 1.0e-12
  epsilon_num: 1.0e-8

evaluation:
  method: linear
  learning_forward_transfer: true
  learning_forward_transfer_baseline: isolated_task_first
  knn_k: 20
  batch_size: 256
  max_distance_matrix_size: 5000000
  max_eval_train_examples: 512
  max_eval_test_examples: 256

logging:
  progress: true
  progress_interval: 1

plots:
  enabled: true

linear_eval:
  enabled: true
  epochs: 1
  batch_size: 256
  lr: 1.0
  momentum: 0.0
  weight_decay: 0.0
  scheduler: step
  lr_decay_steps: [60, 80]
  max_train_examples: 512
  max_test_examples: 256
  log_frequency: 1
